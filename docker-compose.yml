version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: jobmatch_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobmatch_ai
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./JobMatch-Backend
      dockerfile: Dockerfile
    container_name: jobmatch_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/jobmatch_ai
      - DATABASE_NAME=jobmatch_ai
      - SECRET_KEY=${SECRET_KEY:-change-this-production-secret-key-min-32-chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=5
      - ENVIRONMENT=production
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: jobmatch_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:
